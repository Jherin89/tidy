name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-aarch64:
    name: aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="tidy-${version}-aarch64-apple-darwin"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/aarch64-apple-darwin/release/tidy" "${stage}/tidy"
          chmod +x "${stage}/tidy"
          cp LICENSE README.md "${stage}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Smoke test
        run: |
          ./target/aarch64-apple-darwin/release/tidy --version
          mkdir -p "$RUNNER_TEMP/dl"
          ./target/aarch64-apple-darwin/release/tidy "$RUNNER_TEMP/dl"
      - name: Release notes
        id: notes
        shell: bash
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - name: Attach archive
        uses: softprops/action-gh-release@v2
        with:
          name: tidy ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
